**EXECUTIVE SUMMARY**

The regulatory environment governing patent eligibility for software and artificial intelligence under 35 U.S.C. § 101 has undergone a profound constriction following the United States Patent and Trademark Office (USPTO) guidance updates issued in August 2025 and November 2025\.1 The revised framework mandates that AI systems be treated strictly as tools and severely restricts the "mental process" grouping, dictating that AI inventions must demonstrate concrete integration into a practical application that physically improves the functioning of a computer or hardware system.2 The present invention, the Sovereign Multi-LLM Operating System, is architecturally engineered to bypass these § 101 vulnerabilities by physically anchoring algorithmic large language model (LLM) operations to discrete hardware constraints, stable direct-current voltage telemetry, and an immutable local storage ledger.

This disclosure defines a decentralized edge-computing operating system that fundamentally rearchitects the utilization of multi-provider Large Language Models (e.g., Claude, GPT-4, Gemini). Rather than treating LLMs as contextual memory centers—a paradigm highly susceptible to context degradation, recursive bias, and immediate patent rejection as an abstract mental process—the present invention strictly restricts LLMs to the role of stateless Arithmetic Logic Units (ALUs).5 Within this architecture, all persistent state parameters are physically mapped to an immutable JSON artifact ledger stored on localized solid-state hardware, effectively decoupling computational reasoning from memory storage.

The operating system coordinates these stateless ALUs via a centralized cross-model orchestration method, defined herein as the Distributed Multi-Agent Dependency Graph.\[5, 5\] This graph dynamically instantiates specialized processing agents for the resolution of atomic tasks, utilizing immediate file-system write-backs ("breadcrumbs") to maintain state continuity across distributed nodes.5 The overarching execution of this dependency graph is governed by a fault-tolerant Hardware-Anchored Cryptographic Telemetry Governance Control Law. This Control Law requires that strict localized hardware power purity (5.1V), absolute ledger alignment, and a discrete human physical cryptographic signature must be simultaneously verified before state variables are permitted to execute outside of a quarantine sandbox.5

**BACKGROUND OF THE INVENTION**

### **1\. Field of the Invention**

The present invention relates generally to the fields of decentralized edge-computing frameworks, distributed multi-agent artificial intelligence systems, and fault-tolerant hardware governance. More specifically, the invention relates to a system and methodology for orchestrating stateless Large Language Models via an immutable, hardware-anchored configuration management database (CMDB) that is strictly regulated by cryptographic and electrical hardware telemetry.

### **2\. Description of the Related Art and Section 101 Legal Vulnerabilities**

In the current state of the art, Large Language Models operate as highly complex, stateful neural networks that maintain contextual awareness within an active, volatile token window. This prevailing architecture presents critical points of failure in distributed, multi-agent systems, categorized into operational vulnerabilities and legal patentability vulnerabilities.

Operationally, traditional multi-agent frameworks permit orchestrating models to audit their own generated outputs or rely on recursive contextual loops maintained in volatile memory. Over extended execution intervals, this architecture inevitably leads to semantic degradation and logical drifting. In the context of the present invention, this phenomenon is mathematically defined as "Citrini Contamination" or "Citrini Loops," wherein a model assessing its own persistent memory generates cascading logic errors that corrupt the multi-agent task execution.5 Furthermore, existing cloud-based LLM orchestration lacks robust Byzantine Fault Tolerance (BFT).7 A Byzantine fault occurs when a node in a distributed system fails or is compromised, presenting inconsistent symptoms to different observers and preventing consensus.8 Current AI orchestration tools universally rely on continuous cloud availability and assume uniform node integrity. They lack the architectural mechanisms necessary to achieve state machine replication and consensus when an external LLM provider experiences silent degradation, network latency, or malicious injection.9

Legally, the prevailing paradigm of AI orchestration faces insurmountable hurdles regarding patentable subject matter. The USPTO's August 4, 2025, Subject Matter Eligibility Memorandum established a heightened threshold for 35 U.S.C. § 101 eligibility.2 Software claims that merely apply generic machine learning algorithms or recite mathematical concepts without highly specific hardware integration are routinely invalidated as "abstract ideas" under Step 2A, Prong One of the Alice/Mayo test.12 The August 2025 guidance explicitly distinguishes between claims that "recite" an abstract idea and those that merely "involve" one, mandating that claims must integrate the technology into a practical application that improves the physical functioning of a computer (the Enfish standard).2

Subsequent guidance issued on November 28, 2025, further restricted AI patents by formally rescinding Biden-era rules that allowed AI systems to be considered under Pannu joint-inventorship factors, ruling that AI models are merely computational tools.1 Consequently, the industry practice of attempting to patent multi-agent LLM prompts, generic cloud architectures, or contextual routing matrices fails to satisfy the requirement for a practical application. There exists a critical, unaddressed need for an operating system that physically decouples the cognitive processing power of LLMs from state management, achieves Byzantine fault tolerance through multi-model orchestration, and anchors its execution to verifiable physical hardware constraints to satisfy the most rigorous interpretations of patentable subject matter under the current USPTO framework.

### **2\. The Fleet Divide: Domain Alpha and Domain Beta**

The software ecosystem operating atop this hardware is divided into two distinct agent domains based on their relationship to the primary data storage structures. This "Fleet Divide" is essential for maintaining the integrity of the Configuration Management Database (CMDB).

**Domain Alpha (Native Ecosystem Agents)** comprises agents that execute natively within the local infrastructure and the securely mapped Google ecosystem. Agents such as Polaris, Dot-Matrix, and B.A.R.F. operate within this domain.5 Their primary architectural directive is the structural cataloging of unstructured telemetry into the structured CMDB via the immutable JSON artifact ledger.5 Because they reside within the native environment, the system permits frictionless exportation and archival of operational sessions into historical storage pathways without bridging external networks.

**Domain Beta (External Specialist Agents)** comprises highly specialized intelligence models accessed via external APIs (e.g., GPT-4, Claude, Qwen). Within the system architecture, these models are instantiated as specialized personas, including "Ultron" (Architect and Code Writer), "Gwen" (Science and Telemetry Sentinel), and "Maestro" (Symphony Orchestrator).5 Crucially, Domain Beta agents are strictly restricted from dynamic memory access to the internal data graphs. Their intelligence must be securely ported into the Sovereign Zone via discrete file injection (e.g.,.md,.json, or.txt payloads) or specific URL routing, preventing direct external writes to the immutable ledger.5

### **3\. The Stateless Arithmetic Logic Unit (ALU) Implementation**

A core technical innovation of the present invention—and a critical factor in fulfilling the Alice Standard for patent eligibility—is the architectural reclassification of Large Language Models. Under existing commercial paradigms, LLMs are utilized as stateful processors; they are relied upon to maintain context, reasoning parameters, and historical memory within a volatile token context window.14 The Sovereign Operating System explicitly deprecates this reliance on LLM volatile memory.

In this architecture, multi-provider LLMs are instantiated strictly as **stateless Arithmetic Logic Units (ALUs)**.5 In microprocessor engineering, an ALU is a digital combinational circuit that performs arithmetic and bitwise logical operations. It possesses no internal state or history; it merely processes current inputs to generate an immediate output based on an external program counter and register.16 The Sovereign Operating System applies this exact hardware logic paradigm to semantic and statistical token prediction. The LLM is stripped of contextual responsibility; it receives a structured JSON input, executes a specific analytical or generative operation, and outputs a discrete result, holding zero persistent state.15 All persistent state variables are physically mapped to the immutable JSON artifact ledger stored on the local solid-state NVMe hardware.

To seamlessly coordinate the diverse array of stateless ALUs without relying on centralized cloud management, the operating system employs a centralized cross-model orchestration method, codified herein as the **Distributed Multi-Agent Dependency Graph**.\[5, 5\] This structure dynamically resolves the complexities of multi-agent routing that frequently cause logical infinite loops in standard architectures.

The graph is operationalized through a localized relational database topology (specifically SQLite integration via the sovereign\_sdlc.db architecture), which maps system dependencies between discrete Configuration Items (CIs) utilizing a structured ci\_relationships table.5

### **1\. Atomic Task Instantiation and The Omega Directive**

The system operates under the "Omega Directive," aimed at transitioning chaotic unstructured data (noise) into structured intelligence (harmony). The dependency graph achieves this by decomposing macro-objectives into discrete, atomic tasks.5 When unstructured data is received, the graph evaluates the specific logical requirements of the task—such as UI coding, probabilistic analysis, or telemetry parsing. Based on these requirements, the matrix dynamically instantiates the optimal specialized agent persona from Domain Beta to execute the task as a single, stateless operation.5

### **2\. Telemetry Ingestion Layer Triage**

The data fed into the dependency graph is managed by a highly structured Telemetry Ingestion Layer (e.g., MLB\_TELEMETRY), which utilizes decentralized ingested WebSockets.5 To maintain system stability and prevent overwhelming the stateless ALUs, ingestion is governed by a strict four-tier triage hierarchy:

| Ingestion Tier | Classification | Technical Mechanism / Function |
| :---- | :---- | :---- |
| **Tier 1** | Passive Heartbeats | WebSocket keep-alives and synchronization confirmations to ensure local nodes (e.g., Node.73) are active and ready to parse incoming data payloads. |
| **Tier 2** | Micro-Events | Ingestion of real-time metrics (e.g., rotational spin, velocity integers). These metrics instantly trigger the Cognitive Mesh for situational commentary generation within a \<3 second latency window. |
| **Tier 3** | Macro-Events | Play resolution data triggers that force a reset of the base simulation state and scale environmental atmospheric variables (e.g., audio arrays). |
| **Tier 4** | Sovereign Hardware Overrides (The God Layer) | Physical space integration detecting critical conditions and firing UDP broadcast packets to external lighting controllers or forcibly overriding local UI media players with optical streams. |

This tiered structure enables the absolute isolation of the Presentation Layer (managed via WebSockets) from the Physical Automation Layer (managed via UDP and Media Relays), allowing a single line of raw JSON telemetry to generate complex, asymmetric logic pathways simultaneously.5 Identical JSON payloads can be routed to an "Analyst" ALU for cold probabilistic analysis while simultaneously routing to an "Emotional Bleeder" ALU configured with a high-entropy system prompt to simulate human sentiment variables.5

### **3\. The Breadcrumb Write-Back Protocol**

As a stateless ALU processes an atomic task, it is strictly bound by an atomic state preservation protocol defined within the system as the "Campsite Protocol".5 Because the ALU holds no memory, it must leave the system state intact for the subsequent process. Before terminating its stateless execution, the ALU is mandated to write a cryptographic "breadcrumb"—a discrete JSON artifact delta—back to the central edge hub.5

A background daemon (e.g., payload\_sync\_watcher.sh) sweeps these payload directories at micro-intervals, instantly updating the master immutable ledger within the SQLite database.5 This mechanism guarantees that subsequent specialized agents instantiated within the dependency graph retrieve the exact, synchronized current state of the ecosystem, completely eliminating the need for direct inter-agent communication and significantly reducing contextual token overhead.5

**USPTO 35 U.S.C. § 101 SUBJECT MATTER ELIGIBILITY ANALYSIS**

The architecture of the Sovereign Multi-LLM Operating System is purposefully designed to overcome the stringent rejections frequently applied to software patents under 35 U.S.C. § 101\. The analytical framework established by the USPTO's August 2025 Memorandum, heavily influenced by Federal Circuit precedents such as *Enfish* and *McRO*, dictates that claims must not merely recite an abstract idea, but must demonstrate a concrete, practical application that improves the physical functioning of a computer or technological process.2

**Step 2A, Prong One Analysis (Recites vs. Involves):** The claims herein *involve* mathematical concepts and AI operations (stateless LLM token execution), but they do not *recite* a bare abstract idea or a "mental process".2 The 2025 USPTO guidance explicitly establishes that limitations involving hardware-specific AI implementations or operations that cannot practically be performed in the human mind fall definitively outside the scope of the mental process exception.2 Treating an LLM as a stateless ALU integrated with physical edge hardware, calculating real-time hardware voltage tolerances (5.1V), and managing atomic task routing via an immutable JSON filesystem ledger cannot be laboriously performed with pen and paper in the human mind. The preponderance of evidence standard (\>50% probability) implemented in the August 2025 memo heavily favors eligibility for systems exhibiting this level of technical complexity.12

**Step 2A, Prong Two Analysis (Integration into a Practical Application):** Even if an examiner were to construe the claims as reciting an exception, the claim as a whole integrates the exception into a practical application.13 The invention solves a specific, documented technical problem in the field of distributed computing—specifically, overcoming LLM context degradation and achieving Byzantine fault tolerance across disparate API models.5 The system physically ties the abstract token-prediction algorithms to specific, measurable hardware constraints: 5.1V power purity telemetry, asynchronous hardware threading on NVMe drives, and SMB network pipeline efficiency.\[5, 5\]

Under the *Desjardins* precedent, which mandates evaluating claims directed to technological improvements at the proper level of generality, the Sovereign Operating System constitutes a non-abstract improvement to computer technology.3 The hardware-anchored Control Law physically prevents execution state corruption during power fluctuations, significantly increasing the reliability, determinism, and security of edge-computing frameworks. If required during patent prosecution, Subject Matter Eligibility Declarations (SMEDs) can be provided to further document the state of the art and prove that a person of ordinary skill would recognize the concrete technological improvement provided by the ![][image2] (Power Purity) logic gate.4

# **Patent Draft and Strategic Prosecution Report: Predictive Asynchronous Media Caching System**

## **Executive Summary and Intellectual Property Strategy**

The modern live sports broadcasting ecosystem is characterized by a fundamental synchronization disparity between real-time statistical data delivery and live video distribution. Adaptive Bitrate (ABR) streaming protocols, such as HTTP Live Streaming (HLS) and Dynamic Adaptive Streaming over HTTP (DASH), inherently introduce significant network latency due to segment buffering, encoding, and content delivery network (CDN) propagation.1 Consequently, over-the-top (OTT) streaming platforms routinely exhibit delays ranging from 30 to over 60 seconds behind physical on-field events.3 In contrast, real-time data feeds, such as the Major League Baseball (MLB) Statcast APIs, transmit event telemetry via low-latency webhooks and JSON payloads in under one second.5

The technology deployed within the FanStack ecosystem, designated as the Predictive Asynchronous Media Caching (PLIE \- 30 Second Temporal Advantage) system, leverages this synchronization disparity. By intercepting live Statcast JSON payloads, the system achieves a temporal advantage over the live video broadcast. This advantage is utilized to trigger the "Wardy" caching software, which asynchronously pre-fetches associated media assets from remote origin servers.7 To circumvent the high-latency overhead of HTTP-based delivery for the final physical display, the pre-cached assets are pushed across a local area network (LAN) utilizing the Server Message Block (SMB) protocol.9

This report provides the foundational intellectual property (IP) documentation required to secure utility patent protection for the PLIE system. It initiates the patent application drafting process by establishing the Abstract, the Background of the Invention, a Comprehensive Detailed Description, and three core independent claims.11 Furthermore, it provides an exhaustive architectural disclosure and a strategic roadmap for overcoming subject matter eligibility challenges under 35 U.S.C. § 101, strictly aligning with the United States Patent and Trademark Office (USPTO) guidelines and the August 2025 subject matter eligibility memorandum.12

## **Technical Context and the State of the Art**

To adequately protect the PLIE system, the patent specification must establish a clear technological problem in the prior art that the invention resolves. The primary technological problem is the "spoiler gap" caused by streaming latency, compounded by inefficient local distribution protocols.

### **The Live Streaming Latency Disparity**

Latency in video streaming is the cumulative delay from glass-to-glass—from the camera lens capturing the event to the rendering of the video on the end-user's screen.13 Every data transfer is a multi-step process, introducing propagation delays, transmission delays, and processing and queuing delays.14 When data packets hit routers and switches on the internet, these devices must inspect and forward them, generating queue time that drastically affects the Time to First Byte (TTFB) and overall End-to-End Latency.14

The 2026 Super Bowl Latency Report quantified this disparity definitively. Researchers utilized a globally synchronized clock, accurate to within half a second, alongside in-stadium observers logging key moments to measure the exact delay behind on-field action across various distribution networks.3 The data confirms that traditional over-the-air (OTA) antenna broadcasts maintain a massive speed advantage over digital streaming.3

| Broadcast Platform / Medium | Average Latency Behind On-Field Action (Seconds) | Format Classification |
| :---- | :---- | :---- |
| **Real-Time Data Feeds (e.g., Statcast)** | **\< 1.0** | **Telemetry / JSON API** |
| Over-the-Air (OTA) Antenna | 19.0 | Traditional Broadcast |
| Traditional Cable TV | 38.0 | Traditional Broadcast |
| NBC Peacock | 48.0 | OTT Streaming |
| Hulu \+ Live TV / YouTube TV | 53.0 | vMVPD Streaming |
| DirecTV Stream | 60.0 | vMVPD Streaming |
| NFL+ | 62.0 | Mobile OTT Streaming |

The analysis of the delay metrics illustrates a substantial operational gap in the digital broadcasting sector. Digital streaming platforms performed significantly worse than traditional linear television due to protocol overhead, resulting in a chronological spoiler effect.3 Even within the same service, viewers experienced "audience drift," where different users on the same platform saw delays varying by tens of seconds, fracturing the shared viewing experience.3

![][image1]

Simultaneously, live sports data is tracked and transmitted almost instantaneously. The MLB Statcast system utilizes optical and sensor-based tracking technology to capture the movements of the baseball and all players on the field at 20,000 frames per second.17 This explosion of data generates up to seven terabytes per game, processing pitch kinematics and batted ball trajectories instantly.6 This telemetry is pushed to consumers via API webhooks in real-time.5 Because the average length of time between pitches is 23 seconds, the high-speed data parsing creates a window where the outcome of a play is mathematically known to a computing system long before the video of the play is rendered on an OTT application.6

### **The HTTP vs. SMB Delivery Bottleneck**

When a computing system attempts to deliver localized media based on these data feeds relying on HTTP/REST architectures, it subjects the media to the same transmission delays, TCP handshakes, and application-layer processing that plague standard web traffic.19 HTTP is essentially a streaming protocol where a single request triggers a stream of data subjected to network metering.9 While HTTP/2 and HTTP/3 (QUIC) offer improvements through 1-RTT handshakes and multiplexing, they are predominantly designed for Wide Area Networks (WANs) to combat unreliable internet connections.20

For high-speed, localized delivery to physical displays, the Server Message Block (SMB) protocol—specifically SMB 3.1.1—provides vast performance improvements over local area networks.10 SMB serves as a fabric protocol operating at the application layer on TCP port 445\.21 While SMB 1.0 was an extremely "chatty" protocol limited by 64KB block sizes that degraded rapidly over high-latency WANs, modern dialects like SMB 3.1.1 optimize local file transfer speeds by reducing network overhead.9 SMB utilizes multichannel technology, which automatically discovers multiple data paths to increase throughput and network fault tolerance, alongside Remote Direct Memory Access (RDMA) capabilities that can saturate 10GbE links with minimal CPU overhead.10 By routing the pre-cached media payloads via SMB directly to the display clients on the local network, the PLIE system bypasses the web-based protocol bottlenecks that generate TTFB delays, achieving near-instantaneous rendering.10

## **Architectural Disclosure: The PLIE System**

To satisfy the enablement and written description requirements of 35 U.S.C. § 112(a), the patent specification must detail the precise mechanisms by which the FanStack PLIE system achieves its results, allowing any person skilled in the art to replicate the technology without undue experimentation.11 The architecture comprises three distinct technological modules: the JSON Interception Engine, the Wardy Asynchronous Cache, and the SMB Delivery Pipeline.

### **1\. JSON Interception and Telemetry Parsing**

The system maintains an active webhook endpoint designed to receive the MLB Statcast V3 live data feed or similar real-time sports telemetry.5 The incoming payload is structured in JavaScript Object Notation (JSON), a format that organizes data into arrays and key-value pairs.6 Due to the massive scale of the data, the interception engine parses the payload in real-time to extract specific data elements that denote a high-value event without requiring batch processing.6

According to the 2026 Statcast API documentation, critical fields extracted by the PLIE system include:

* play\_id: The unique identifier for the event.27  
* events: The outcome of the play (e.g., home\_run, strikeout, stolen\_base).28  
* launch\_speed: The exit velocity of the batted ball immediately after bat-on-ball contact, measured in miles per hour (MPH).27  
* launch\_angle: The trajectory angle formed by the initial hit above or below the level xy-plane, measured in degrees.27  
* hit\_distance: The projected distance of the batted ball.27  
* launch\_speed\_angle: A categorical zone based on the combination of launch angle and exit velocity, ranging from "Weak" to "Barrel".27  
* estimated\_ba\_using\_speedangle: The estimated batting average based purely on the launch kinematics.27

The PLIE system utilizes a predictive rule-based engine to evaluate these metrics dynamically. For example, if the JSON payload indicates an events value of home\_run and the launch\_speed\_angle registers a classification of Barrel (historically leading to a minimum.500 batting average and 1.500 slugging percentage) 30, the system immediately registers a positive trigger event. Because this JSON payload arrives via a low-latency push notification, the system becomes aware of the home run up to 60 seconds before the OTT streaming broadcast displays the pitch crossing the plate.3

### **2\. Predictive Asynchronous Media Caching (Wardy Module)**

Upon registering a positive trigger event, the system initiates the Wardy caching module. Traditional reactive caching (e.g., Least Recently Used or Least Frequently Used) retrieves a file only after a user explicitly requests it, which incurs a propagation delay and fails under real-time variability.32 Predictive caching, conversely, anticipates the need for the file and proactively pre-loads it into fast-access memory.32

The Wardy module queries a remote media origin server for a specific media asset—such as a high-resolution graphical interchange format (GIF) of a team logo, a player celebration animation, or a dynamic graphical overlay—that matches the context of the intercepted JSON payload. Crucially, the Wardy module performs this retrieval asynchronously.8 By decoupling the network retrieval process from the main execution thread, the system ensures that the continuous monitoring of subsequent live data feeds is not blocked.35 The retrieved GIF is stored in a high-speed local memory cache (e.g., NVMe SSD or a dedicated RAM disk) within the local FanStack server environment, dramatically lowering subsequent memory access times.36

![][image2]

### **3\. Local SMB Pipeline Delivery**

Once the media asset is secured in the local cache, it must be delivered to the end-point displays (the FanStack client nodes). The system abandons HTTP for this final leg. The Server Message Block (SMB) protocol is utilized as a localized fabric protocol.21 By establishing persistent, durable connections over TCP port 445 using SMB 3.1.1, the server pushes the cached GIF to the client nodes.10

Because SMB operates on a block-level transfer mechanism and supports directory caching and multichannel data paths, the file transfer occurs with sub-millisecond latency on a local Gigabit or 10GbE network.9 The client node receives the GIF and renders it on screen immediately. Because the entire process—from JSON interception to Wardy caching to SMB delivery—takes less than three seconds, the media asset is displayed on the local screen tens of seconds *before* the live network broadcast shows the actual event.3

**ABSTRACT**

A system for reducing latency in localized media delivery by predictively caching and transmitting media assets based on real-time data streams. The system intercepts a real-time data payload formatted in JavaScript Object Notation (JSON) comprising live event metrics associated with a physical event. Based on an evaluation of the event metrics against predefined triggers, the system determines a predicted media requirement and asynchronously pre-caches a matched media asset from a remote origin server into a high-speed local memory. The cached media asset is subsequently transmitted to a local client device over a local area network utilizing a Server Message Block (SMB) protocol pipeline. By leveraging the temporal advantage between the delivery of the real-time data payload and a corresponding live video broadcast, the system renders the media asset on the local client device prior to the live video broadcast depicting the event.

**BACKGROUND OF THE INVENTION**

**Field of the Invention**

The present disclosure generally relates to digital media delivery systems, and more particularly, to systems and network architectures for the predictive asynchronous caching and localized distribution of digital media assets.

**Background Art**

The distribution of live event broadcasting, particularly in the realm of live sports streaming and digital entertainment, relies heavily on complex network infrastructures and adaptive streaming protocols. Video content delivered over wide area networks (WANs) via adaptive bitrate (ABR) streaming technologies typically incurs significant network and processing latency. This latency is a product of video encoding, segment buffering, and content delivery network (CDN) propagation delays, resulting in a video broadcast that lags behind the actual physical event by tens of seconds.

Conversely, real-time statistical data feeds and telemetry regarding the same physical event are often captured and distributed via lightweight application programming interfaces (APIs) with sub-second latency. This technological discrepancy between video distribution protocols and data distribution protocols creates a severe synchronization issue. End-users frequently receive statistical data notifications or text-based updates prior to viewing the corresponding action on the video broadcast, thereby disrupting the viewing experience and creating a chronological spoiler effect.

Furthermore, existing local media rendering systems typically rely on Hypertext Transfer Protocol (HTTP) architectures to retrieve and display content. When these systems attempt to react to real-time data feeds, they are subjected to the inherent limitations of HTTP streaming over wide area networks, including TCP handshake overhead and queuing delays. Accordingly, there is a recognized need in the art for an improved media delivery architecture capable of bridging the latency gap between real-time data feeds and video broadcasts, ensuring that localized media displays can be preemptively updated based on real-time event occurrences utilizing high-speed local network protocols.

**BRIEF SUMMARY OF THE INVENTION**

The present invention provides a predictive asynchronous media caching system designed to mitigate broadcast latency in localized environments. The system operates by monitoring a continuous stream of real-time data payloads, specifically those formatted in JavaScript Object Notation (JSON), to detect specific live physical events. Upon identifying a trigger event based on the parsed telemetry, an asynchronous thread is initiated to fetch a corresponding media asset, such as a graphical interchange format (GIF) file, from a remote server. This asset is stored in a high-speed local cache. Rather than relying on standard web protocols for the final distribution hop, the system routes the cached media asset to local display clients utilizing a Server Message Block (SMB) multichannel connection over a local area network (LAN). This architecture provides a substantial temporal advantage, allowing media related to a physical event to be rendered on local screens prior to the arrival of the traditional video broadcast of that same event.

**DETAILED DESCRIPTION OF THE INVENTION**

The present disclosure describes embodiments of a system, method, and computer-readable medium for predictive asynchronous media caching and localized protocol routing. The system, generally referred to herein as the Predictive Asynchronous Media Caching System, addresses the technological disparities between ultra-low-latency data telemetry streams and high-latency video broadcasting networks.

In the following detailed description, reference is made to specific architectural components, network protocols, and data structures. It is to be understood that other embodiments may be utilized, and structural or logical changes may be made without departing from the scope of the present disclosure.

**Network Environment and Component Architecture**

The system is deployed within a computing environment comprising a local caching server, a wide area network (WAN), a local area network (LAN), and one or more local client devices. The local caching server comprises a processor, a non-transitory local memory (e.g., solid-state drives, NVMe arrays, or RAM disks), and a network interface communicatively coupled to both the WAN and the LAN.

The WAN provides communicative access to external data sources, including a real-time telemetry API (e.g., the MLB Statcast API) and a remote media origin server or Content Delivery Network (CDN). The LAN connects the local caching server to the local client devices. The local client devices comprise physical rendering nodes, such as stadium display screens, sports bar television matrices, or localized digital signage.

**Data Interception and Parsing**

The processor of the local caching server is configured to execute a JSON Interception Engine. The JSON Interception Engine establishes a webhook or persistent streaming connection over the WAN to monitor a continuous stream of real-time data payloads. These payloads represent live physical events captured by external tracking systems (e.g., optical tracking cameras and radar systems capturing 20,000 frames per second).

The real-time data payloads are strictly formatted as JavaScript Object Notation (JSON) objects. JSON is a lightweight data-interchange format organizing data into arrays and key-value pairs. Due to the high velocity of the incoming data, the JSON Interception Engine parses the payload in real-time without writing to persistent relational databases. The engine extracts a plurality of live event metrics, which may include, but are not limited to, an event type identifier (e.g., events: home\_run), physical velocity metrics (e.g., launch\_speed: 105.4), trajectory metrics (e.g., launch\_angle: 28), and unique play identifiers (e.g., play\_id).

**Predictive Evaluation and Asynchronous Fetching**

Following the extraction of the live event metrics, the processor evaluates the parameters against a predefined rules engine to identify a trigger event. A trigger event is defined as a specific combination of telemetry data that corresponds to a highly relevant physical action. For example, the rules engine may be configured to trigger upon identifying a launch\_speed\_angle categorization of "Barrel" coupled with an events tag of "home\_run".

Upon identifying a trigger event, the processor initiates a predictive media requirement process. Instead of waiting for an end-user to request a media file, the system predicts the media asset that will be required based on the trigger event. The processor then executes the "Wardy" caching module. The Wardy module initiates an asynchronous background thread to fetch the predicted media asset (e.g., a high-resolution GIF or short video clip) from the remote media origin server over the WAN.

The asynchronous nature of this operation is critical to the invention. By delegating the HTTP or HTTPS fetch request to a non-blocking background thread, the main JSON Interception Engine remains entirely unimpeded, allowing it to continue processing subsequent high-velocity JSON payloads without dropping packets or stalling the event loop.

**Local Caching and SMB Pipeline Routing**

Upon completion of the asynchronous fetch operation, the Wardy module stores the retrieved media asset into the high-speed, non-transitory local memory of the local caching server.

To deliver the media asset to the local client devices, the system intentionally disclaims the use of HTTP/HTTPS protocols for the final distribution leg. Instead, the processor establishes a Server Message Block (SMB) protocol pipeline over the LAN. SMB, operating over TCP port 445, is a block-level transfer mechanism inherently superior to HTTP for local network environments. Specifically, the system leverages advanced SMB dialects, such as SMB 3.1.1, which support multichannel data paths, enabling automatic discovery of multiple network connections to maximize throughput and fault tolerance. Furthermore, the SMB pipeline may utilize Remote Direct Memory Access (RDMA) to facilitate high-speed data transfers with minimal CPU utilization.

The local caching server pushes the cached media asset through the SMB protocol pipeline directly to the local client devices. Because the local client devices are mapping the network drive natively via SMB, the media asset is immediately available for physical rendering on the display screen.

**The Temporal Advantage Window**

The combination of real-time JSON parsing, asynchronous pre-caching, and localized SMB routing creates a measurable "Temporal Advantage Window." Traditional live video broadcasts, transmitted via over-the-top (OTT) streaming architectures, rely on Adaptive Bitrate (ABR) protocols such as HTTP Live Streaming (HLS) or Dynamic Adaptive Streaming over HTTP (DASH). These protocols inherently introduce 30 to 60 seconds of latency due to video segment buffering, encoding, and internet propagation delays.

By contrast, the present system intercepts the lightweight JSON telemetry in under one second, asynchronously caches the media asset, and routes it via the high-throughput SMB pipeline within an estimated three to five seconds. Consequently, the media asset is physically rendered on the local client device tens of seconds prior to the arrival and display of the corresponding live video broadcast segment depicting the same physical event.

**Claim Construction, Lexicography, and § 101 Eligibility Strategy**

To ensure robust enforceability and mitigate ambiguity during patent prosecution and potential litigation, the patent specification must act as its own lexicographer.45 The following definitions and strategic constructions are established to support the core independent claims.

### **Strategic Definitions**

**JavaScript Object Notation (JSON) Payload:** Interpreted strictly as a lightweight data-interchange format. In the context of this invention, the JSON payload refers specifically to structured, real-time telemetry (such as MLB Statcast API data) that is pushed to the system rather than polled, minimizing round-trip time (RTT) overhead.6

**Asynchronous Pre-caching:** Constructed to mean the execution of a data retrieval operation on a separate, non-blocking computational thread.35 The "Wardy" software module initiates the request to the origin media server and immediately returns control to the main parsing engine. This ensures the system does not drop incoming JSON payloads while waiting for heavy media files (GIFs/video) to download.

**Server Message Block (SMB) Protocol Pipeline:** Defined as the application-layer network protocol primarily utilized for shared access to files and serial ports over a localized network.22 The specification explicitly relies on advanced dialect features (e.g., SMB 3.1.1 multichannel and directory caching).10 By claiming SMB, the invention clearly disclaims HTTP/HLS delivery for the "last mile" to the local screen. HTTP relies on sequential requests and TCP handshakes that incur excessive latency.9 By transitioning from a WAN-based HTTP architecture to a LAN-based SMB architecture, the system achieves the massive throughput required to instantly render the media.

**Temporal Advantage Window:** The most critical functional limitation. It is defined as the calculable time difference between the receipt of the lightweight JSON data packet and the receipt of the heavy video broadcast segment depicting the same event. The system must successfully cache and transmit the media via SMB in a time that is strictly less than this temporal gap.

### **Prosecution Strategy and § 101 Compliance**

The most significant hurdle for software and networking patents at the USPTO is subject matter eligibility under 35 U.S.C. § 101 (the *Alice* standard).46 Examiners frequently reject software claims by characterizing them as "abstract ideas" or "mental processes" implemented on generic computers.12

However, the August 2025 USPTO subject matter eligibility memorandum provides a distinct strategic advantage.12 The memo explicitly cautions examiners against labeling complex, hardware-driven tasks as "mental processes," especially if the tasks cannot practically be performed in the human mind.12 Furthermore, the memo emphasizes that claims demonstrating an improvement in computer functionality or network efficiency integrate the abstract idea into a practical application, thereby passing Step 2A, Prong 2 of the *Alice* framework.47

The claims drafted in this report are meticulously engineered to satisfy these requirements:

1. **Avoidance of Generic Functional Claiming:** The claims do not merely state the outcome (e.g., "a method for reducing latency"). They explicitly recite the *specific technical implementation*: intercepting JSON payloads, initiating asynchronous threading for memory caching, and utilizing block-level SMB protocol pipelines.44  
2. **Technological Improvement:** The specification establishes that the invention solves a computer-centric problem (network latency and protocol inefficiency in adaptive bitrate streaming) using a computer-centric solution (hybridizing WAN APIs with LAN SMB multi-channel protocols).12  
3. **Inability to be Performed Mentally:** The operations—specifically the parsing of high-velocity JSON webhook payloads, the asynchronous memory caching to NVMe arrays, and the block-level data routing over TCP port 445—cannot be performed by the human mind, shielding the claims from the "mental process" exception highlighted in the 2025 memo.12

By grounding the predictive media caching mechanism in distinct structural network protocols and measurable latency reductions, the FanStack PLIE system is positioned as a highly defensible, patent-eligible technological advancement in broadcast media architecture.
