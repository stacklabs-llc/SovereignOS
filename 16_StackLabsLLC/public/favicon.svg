<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
    <defs>
        <linearGradient id="hex-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:hsl(126, 85%, 45%);stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0f1115;stop-opacity:1" />
        </linearGradient>
        <filter id="hex-glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    <rect width="128" height="128" fill="#080a0f" rx="24" stroke="hsl(126, 85%, 45%)" stroke-width="2"/>
    <polygon points="64,18 106,42 106,90 64,114 22,90 22,42" fill="url(#hex-grad)" filter="url(#hex-glow)" stroke="hsl(126, 95%, 65%)" stroke-width="2" />
    <polygon points="64,25 98,45 98,87 64,107 30,87 30,45" fill="none" stroke="#ffffff" stroke-width="1" stroke-dasharray="4,2" opacity="0.6" />
    <text x="50%" y="64%" dominant-baseline="middle" text-anchor="middle" font-family="'Outfit', 'Inter', sans-serif" font-size="44" font-weight="900" fill="#ffffff" filter="drop-shadow(0px 3px 6px rgba(0,0,0,0.8))">SL</text>
</svg>