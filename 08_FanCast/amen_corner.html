<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amen Corner - CaddyStack Live Feed</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Playfair+Display:ital,wght@0,600;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --augusta-green: #004d34;
            --augusta-green-dark: #002b1d;
            --augusta-green-light: #00734f;
            --gold: #D4AF37;
            --gold-hover: #f3e5ab;
            --bg-void: #030a07;
            --card-glass: rgba(12, 38, 28, 0.45);
            --border-glass: rgba(212, 175, 55, 0.2);
            --text-main: #e2f0ea;
            --text-muted: #8ba89f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-void);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% 10%, var(--augusta-green-dark) 0%, var(--bg-void) 80%);
        }

        /* Ambient subtle pulse */
        @keyframes subtle-pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.4; }
        }
        .ambient-glow {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            background: radial-gradient(circle at 10% 20%, rgba(0, 115, 79, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 50%);
            z-index: 0;
            animation: subtle-pulse 10s ease-in-out infinite;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            border-b: 1px solid var(--border-glass);
            background: rgba(0, 43, 29, 0.4);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .header-logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-logo svg {
            fill: var(--gold);
            width: 28px;
            height: 28px;
        }

        .header-logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--gold);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .status-ticker {
            font-family: 'Share Tech Mono', monospace;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border-glass);
            padding: 0.4rem 1rem;
            border-radius: 99px;
            color: var(--text-muted);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--gold);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--gold);
        }

        .main-container {
            flex: 1;
            display: flex;
            padding: 1.5rem;
            gap: 1.5rem;
            z-index: 10;
            height: calc(100vh - 80px);
            position: relative;
        }

        /* Edge-to-edge view of the ChatGPT CaddyStack window */
        .chat-section {
            flex: 1;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .chat-header {
            padding: 1rem 1.5rem;
            background: rgba(0, 43, 29, 0.5);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chat-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            font-style: italic;
            color: var(--gold);
        }

        .chat-header span {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            scroll-behavior: smooth;
        }

        /* Custom Scrollbar */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }
        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(212, 175, 55, 0.25);
            border-radius: 99px;
        }

        .message-card {
            background: rgba(0, 15, 10, 0.35);
            border-left: 3px solid var(--gold);
            border-top: 1px solid rgba(255, 255, 255, 0.03);
            border-right: 1px solid rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            padding: 1rem 1.25rem;
            border-radius: 0 12px 12px 0;
            animation: slide-in 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            max-width: 90%;
            align-self: flex-start;
        }

        @keyframes slide-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 0.4rem;
        }

        .message-user {
            font-weight: 600;
            font-size: 0.95rem;
            letter-spacing: -0.01em;
        }

        .message-timestamp {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .message-text {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #d6ede2;
            word-break: break-word;
        }

        .chat-input-bar {
            padding: 1.25rem;
            background: rgba(0, 20, 14, 0.4);
            border-top: 1px solid var(--border-glass);
            display: flex;
            gap: 0.75rem;
        }

        .chat-input-bar input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-glass);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input-bar input:focus {
            border-color: var(--gold);
        }

        .chat-input-bar button {
            background: var(--gold);
            color: var(--bg-void);
            border: none;
            font-weight: 700;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .chat-input-bar button:hover {
            background: var(--gold-hover);
        }

        .chat-input-bar button:active {
            transform: scale(0.98);
        }

        /* Compact side stats just to balance but keep minimal */
        .compact-ticker {
            width: 250px;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            backdrop-filter: blur(20px);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
        }

        .compact-ticker h3 {
            font-family: 'Playfair Display', serif;
            color: var(--gold);
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-glass);
            padding-bottom: 0.5rem;
        }

        .ticker-item {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        .ticker-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            font-family: 'Share Tech Mono', monospace;
        }

        .ticker-value {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .commercial-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            color: var(--gold);
        }

        .commercial-video {
            width: 80%;
            max-width: 800px;
            border: 2px solid var(--gold);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }

        .commercial-title {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>
    <div class="ambient-glow"></div>

    <header>
        <div class="header-logo">
            <!-- Compass Icon SVG representing Amen Corner Sentinel direction -->
            <svg viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
            </svg>
            <h1>Amen Corner</h1>
        </div>
        <div class="status-ticker">
            <span class="status-dot"></span>
            <span id="header-status">AWAITING TELEMETRY...</span>
        </div>
    </header>

    <div class="main-container">
        <!-- Compact side status -->
        <div class="compact-ticker">
            <h3>Tournament</h3>
            <div class="ticker-item">
                <span class="ticker-label">Event</span>
                <span class="ticker-value" id="event-name">The Masters (2025 Sim)</span>
            </div>
            <div class="ticker-item">
                <span class="ticker-label">Status</span>
                <span class="ticker-value" id="event-status">Round 1 (Thursday)</span>
            </div>
            <div class="ticker-item">
                <span class="ticker-label">Current Hole</span>
                <span class="ticker-value">12 - Golden Bell (Par 3)</span>
            </div>
            <div class="ticker-item">
                <span class="ticker-label">Stimp green index</span>
                <span class="ticker-value">12.5 Stimp</span>
            </div>
        </div>

        <!-- Gigantic ChatGPT CaddyStack window -->
        <div class="chat-section">
            <div class="chat-header">
                <h2>CaddyStack Discourse</h2>
                <span id="active-members">MARD ACTIVE: 5 PERSONAS</span>
            </div>
            <div class="chat-messages" id="chat-messages">
                <!-- Messages will stream in here -->
            </div>
            <form class="chat-input-bar" id="chat-form">
                <input type="text" id="chat-input" placeholder="Inject discourse trigger as Pilot James..." autocomplete="off">
                <button type="submit">SEND</button>
            </form>
        </div>
    </div>

    <!-- Commercial Break overlay -->
    <div class="commercial-overlay" id="commercial-overlay">
        <h2 class="commercial-title" id="commercial-title">Commercial Break</h2>
        <video class="commercial-video" id="commercial-video" controls muted></video>
        <button onclick="skipCommercial()" style="margin-top: 1.5rem; background: var(--gold); color: black; border: none; font-weight: 700; padding: 0.5rem 1.5rem; border-radius: 4px; cursor: pointer;">Skip</button>
    </div>

    <script>
        const wsUrl = (window.location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/ws";
        let ws;
        const messagesContainer = document.getElementById("chat-messages");

        function appendMessage(user, text, color, timestamp) {
            const card = document.createElement("div");
            card.className = "message-card";
            if (color) {
                card.style.borderLeftColor = color;
            }

            const meta = document.createElement("div");
            meta.className = "message-meta";

            const userSpan = document.createElement("span");
            userSpan.className = "message-user";
            userSpan.style.color = color || "var(--gold)";
            userSpan.innerText = user;

            const timeSpan = document.createElement("span");
            timeSpan.className = "message-timestamp";
            timeSpan.innerText = timestamp || new Date().toLocaleTimeString().substring(0, 5);

            meta.appendChild(userSpan);
            meta.appendChild(timeSpan);

            const textDiv = document.createElement("div");
            textDiv.className = "message-text";
            textDiv.innerText = text;

            card.appendChild(meta);
            card.appendChild(textDiv);

            messagesContainer.appendChild(card);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function updateState(data) {
            if (data.status_msg) {
                document.getElementById("header-status").innerText = data.status_msg.toUpperCase();
            }
            if (data.event_name) {
                document.getElementById("event-name").innerText = data.event_name;
            }
            if (data.event_status) {
                document.getElementById("event-status").innerText = data.event_status;
            }
        }

        function connect() {
            ws = new WebSocket(wsUrl);
            
            ws.onopen = function() {
                console.log("Connected to Masters Relay!");
                document.querySelector(".status-dot").style.backgroundColor = "var(--gold)";
                document.querySelector(".status-dot").style.boxShadow = "0 0 8px var(--gold)";
            };

            ws.onmessage = function(event) {
                const payload = JSON.parse(event.data);
                
                if (payload.type === "STATE_UPDATE") {
                    updateState(payload.data);
                } else if (payload.type === "CHAT_MESSAGE") {
                    appendMessage(payload.user, payload.text, payload.color, payload.timestamp);
                } else if (payload.type === "CHAT_HISTORY") {
                    messagesContainer.innerHTML = "";
                    payload.messages.forEach(msg => {
                        appendMessage(msg.user, msg.text, msg.color, msg.timestamp);
                    });
                } else if (payload.type === "trigger_event" && payload.event === "COMMERCIAL_BREAK") {
                    triggerCommercial(payload.video_url);
                }
            };

            ws.onclose = function() {
                console.log("Lost connection, retrying...");
                document.querySelector(".status-dot").style.backgroundColor = "#ff3838";
                document.querySelector(".status-dot").style.boxShadow = "0 0 8px #ff3838";
                setTimeout(connect, 3000);
            };

            ws.onerror = function(err) {
                console.error("WS error:", err);
            };
        }

        document.getElementById("chat-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const input = document.getElementById("chat-input");
            if (!input.value.trim()) return;

            if (ws && ws.readyState === WebSocket.OPEN) {
                const msg = {
                    type: "CHAT_MESSAGE",
                    user: "Pilot James",
                    color: "#D4AF37",
                    text: input.value
                };
                ws.send(jsonStr(msg));
                input.value = "";
            }
        });

        function jsonStr(obj) {
            return JSON.stringify(obj);
        }

        function triggerCommercial(videoUrl) {
            const overlay = document.getElementById("commercial-overlay");
            const video = document.getElementById("commercial-video");
            
            // Rewrite URL to serve locally if target network
            let targetUrl = videoUrl;
            if (videoUrl.includes("192.168.1.73:8001")) {
                targetUrl = videoUrl.replace("http://192.168.1.73:8001", "");
            }
            
            video.src = targetUrl;
            overlay.style.display = "flex";
            video.play();
        }

        function skipCommercial() {
            const overlay = document.getElementById("commercial-overlay");
            const video = document.getElementById("commercial-video");
            video.pause();
            overlay.style.display = "none";
        }

        connect();
    </script>
</body>
</html>
