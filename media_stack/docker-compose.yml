version: "3"
services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/sabnzbd:/config
      - /home/james/SovereignOS/media_vault/_incoming:/downloads
      - /home/james/SovereignOS/media_vault:/media_vault
    ports:
      - 8080:8080
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./config/sonarr:/config
      - /home/james/SovereignOS/media_vault:/tv
      - /home/james/SovereignOS/media_vault/_incoming:/downloads
    ports:
      - 8989:8989
    restart: unless-stopped
