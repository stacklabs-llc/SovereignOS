server {
    listen 8999;
    server_name localhost sov73.taila01894.ts.net;

    # Vite Frontend (Scruffys Bar UI)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints handled by FanStack Admin / FanStack Server
    location /api/ {
        proxy_pass http://127.0.0.1:5007/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Sovereign Core API (Decoupled Infrastructure)
    location /cinema {
        proxy_pass http://127.0.0.1:8090/cinema;
        proxy_set_header Host $host;
    }
    location /api/cinema/ {
        proxy_pass http://127.0.0.1:8090/api/cinema/;
        proxy_set_header Host $host;
    }

    # WebSockets for M.A.R.D Engine
    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
    # Kids Daily Adventures API
    location /kids_api/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Kids Daily Adventures Frontend
    location /Kids_Daily_Adventures/ {
        alias /home/james/SovereignOS/Kids_Daily_Adventures/;
        autoindex on;
    }
}
